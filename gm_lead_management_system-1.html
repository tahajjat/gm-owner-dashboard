<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM Lead Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f4f6fb;--side:#0f1b3d;--card:#ffffff;--card2:#f6f8fc;--line:#e6e9f2;--text:#141a33;--muted:#6b7390;
  --accent:#1f6bf2;--accent-ink:#ffffff;--accent-soft:rgba(31,107,242,.09);
  --green:#16a34a;--green-soft:rgba(22,163,74,.10);--amber:#d97706;--amber-soft:rgba(245,158,11,.13);
  --red:#e0383e;--red-soft:rgba(224,56,62,.09);--blue:#1f6bf2;--blue-soft:rgba(31,107,242,.09);
  --purple:#7c4ddb;--purple-soft:rgba(124,77,219,.10);--teal:#14b8a6;--slate:#475569;
  --input:#ffffff;--shadow:0 1px 3px rgba(20,30,70,.06);
}
[data-theme="dark"]{
  --bg:#0c1224;--side:#0a1330;--card:#141b31;--card2:#1a223b;--line:#262f4c;--text:#e7eaf3;--muted:#8d94ad;
  --accent:#4d8bff;--accent-ink:#ffffff;--accent-soft:rgba(77,139,255,.14);
  --green:#4ade80;--green-soft:rgba(74,222,128,.13);--amber:#fbbf24;--amber-soft:rgba(251,191,36,.13);
  --red:#f87171;--red-soft:rgba(248,113,113,.13);--blue:#60a5fa;--blue-soft:rgba(96,165,250,.13);
  --purple:#a78bfa;--purple-soft:rgba(167,139,250,.14);--teal:#2dd4bf;--slate:#94a3b8;
  --input:#0f1528;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Outlined';font-size:19px;line-height:1;vertical-align:middle;font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* sidebar */
aside{width:224px;flex:none;background:var(--side);color:#dfe5f7;padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 4px 20px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#22c1ee);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{display:block;font-size:17px;color:#fff;letter-spacing:-.01em}.brand small{color:#9fb0d8;font-size:11.5px}
.navlbl{font-size:10.5px;letter-spacing:.08em;color:#7f8fb8;padding:14px 12px 6px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#dfe5f7;background:none;border:0;width:100%;text-align:left;font-size:14px;margin-bottom:2px}
.nav .ms{font-size:21px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.active{background:#1f6bf2;color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;background:#e0383e;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:600}
.newtag{background:rgba(74,222,128,.18);color:#4ade80;border-radius:5px;padding:1px 6px;font-size:9.5px;letter-spacing:.05em}
.sidefoot{margin-top:auto;padding-top:16px}
.promo{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:12px;padding:14px;font-size:12.5px;line-height:1.5;color:#dfe5f7;margin-bottom:10px}
.promo .ms{font-size:26px;color:#9fc0ff;margin-bottom:6px}
aside .btn{color:#dfe5f7;border-color:rgba(255,255,255,.14);background:transparent}
/* dashboard */
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%}
.user{display:flex;align-items:center;gap:10px}.user b{display:block;font-size:13.5px}.user small{color:var(--muted);font-size:11.5px}
.user .av{width:36px;height:36px;background:var(--accent);color:#fff;border:0}
.bell{position:relative}.bell i{position:absolute;top:-4px;right:-4px;background:#e0383e;color:#fff;font-size:10px;font-style:normal;border-radius:9px;padding:0 5px;font-weight:700}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{margin:0;font-size:22px;letter-spacing:-.01em}.pagehead p{margin:4px 0 0;color:var(--muted)}
.k6{grid-template-columns:repeat(6,1fr)}
.kc{border-radius:12px;padding:16px;display:flex;gap:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.kc .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.kc .ic .ms{font-size:24px}
.kc .l{font-size:13px;font-weight:600}.kc .v{font-size:24px;font-weight:800;margin:4px 0 2px;display:flex;align-items:baseline;gap:8px}
.kc .v small{font-size:11.5px;font-weight:600}.kc .s{font-size:11.5px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}
.d3{grid-template-columns:1.25fr 1fr .8fr}
.d33{grid-template-columns:1.2fr 1fr 1fr}
@media (min-width:1301px){ .d33.wide1{grid-template-columns:1.75fr .95fr 1.3fr} }
.chead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chead h3{margin:0}
.chead .va{margin-left:auto;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;background:none;border:0}
.card.t{padding:0}.card.t .chead{padding:14px 16px 0}
.card.t table td,.card.t table th{padding:9px 12px;font-size:12.5px}
.card.t th{text-transform:none;letter-spacing:0;font-size:11.5px;background:var(--card2)}
.funnel{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:10px}
.funnel .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;height:100%}
.funnel .col b{font-size:15px}.funnel .col small{font-size:11px;color:var(--muted);margin-bottom:6px}
.funnel .col i{display:block;width:100%;border-radius:4px 4px 0 0}
.conv{display:flex;justify-content:space-around;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.donut{display:flex;gap:16px;align-items:center}
.legend{flex:1;font-size:13px}.legend div{display:flex;align-items:center;gap:8px;padding:5px 0}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}.legend span{flex:1}.legend em{font-style:normal;color:var(--muted);font-size:12px;width:42px;text-align:right}
.qa{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;background:var(--card)}
.qa:hover{border-color:var(--accent)}
.qa .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.qa b{display:block;font-size:13px}.qa small{color:var(--muted);font-size:11.5px}
.score{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:700;border-radius:6px;padding:2px 7px;font-size:12px}
.act div.a{display:flex;gap:10px;padding:7px 0;font-size:12.5px}.act .av{width:26px;height:26px;font-size:10px}
.sav{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:22px;cursor:pointer;transition:.2s}
.sw span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span:before{transform:translateX(16px)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row{flex-wrap:wrap}.row>div{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.tcard{text-align:center}.tcard .av{width:54px;height:54px;font-size:18px;color:#fff;border:0;margin-bottom:8px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;text-align:center}
.stats3 div{background:var(--card2);border-radius:8px;padding:7px 4px}.stats3 b{display:block;font-size:15px}.stats3 small{font-size:10.5px;color:var(--muted)}
.hbar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
.hbar>span:first-child{width:120px;flex:none}.hbar .track{flex:1;height:10px;background:var(--card2);border-radius:6px;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.hbar>b{width:74px;text-align:right;flex:none}
.fu{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fu:last-child{border-bottom:0}.fu .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.set-nav{display:flex;flex-direction:column;gap:2px}
.set-nav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--text)}
.set-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.two-s{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.two-s>*{min-width:0}
.rulef{grid-template-columns:1fr 1fr 1fr auto}
@media (max-width:760px){.rulef{grid-template-columns:1fr}}
@media (max-width:760px){.two-s{grid-template-columns:1fr}.hbar>span:first-child{width:84px}}
/* main */
main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:20px;margin:0;font-weight:700}
.demo{background:var(--amber-soft);color:var(--amber);font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;letter-spacing:.05em}
.spacer{flex:1}
.menu-btn{display:none}
.wrap{padding:20px 24px 60px;max-width:1440px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.green{background:var(--green);color:#06260f;border-color:var(--green);font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .l{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi{overflow:hidden}
.kpi .v{font-size:26px;font-weight:700;margin:6px 0 2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)}.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)}.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-grey{background:var(--card2);color:var(--muted);border:1px solid var(--line)}.p-acc{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.tablewrap{overflow-x:auto}
.av{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.who{display:flex;gap:10px;align-items:center}.who b{display:block;font-size:13.5px}.who small{color:var(--muted);font-size:12px}
.bar{height:7px;border-radius:5px;background:var(--card2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.checks{display:flex;gap:4px}
.chk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:15px}
.chk.ok{background:var(--green-soft);color:var(--green)}.chk.no{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
/* workspace */
.ws-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.ws-head .av{width:44px;height:44px;font-size:14px}
.ws-head h2{margin:0;font-size:20px}
.ready{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:center;margin-bottom:14px}
.rstep{display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.rstep .ms{font-size:20px}
.rstep.ok{border-color:rgba(74,222,128,.35)}.rstep.ok .ms{color:var(--green)}
.rstep.no .ms{color:var(--muted)}
.rstep b{font-size:12.5px;display:block}.rstep small{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.two>*{min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.f input,.f select,.f textarea,.in{width:100%;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{border-color:var(--accent)}
.full{grid-column:1/-1}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sizes .f input{text-align:center;font-weight:600}
.warn{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:9px;font-size:12.5px;margin-top:10px}
.warn.red{background:var(--red-soft);color:var(--red)}.warn.amber{background:var(--amber-soft);color:var(--amber)}.warn.green{background:var(--green-soft);color:var(--green)}
.cellin{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 7px;width:100%;outline:none}
.cellin:hover{border-color:var(--line)}.cellin:focus{border-color:var(--accent);background:var(--input)}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
.iconbtn:hover{color:var(--red);background:var(--red-soft)}
.dl{display:flex;gap:18px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;flex:none}
.ring b{font-size:24px;display:block;line-height:1}.ring small{font-size:10.5px}
/* paper */
.paper{background:#fff;color:#1b1f2e;border-radius:10px;padding:26px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.paper .ph{display:flex;justify-content:space-between;border-bottom:2px solid #5b45e0;padding-bottom:12px;margin-bottom:14px}
.paper h4{margin:0;font-size:18px;color:#5b45e0}
.paper table th{color:#687089;border-color:#e3e6ef;font-size:10px;padding:6px}
.paper table td{border-color:#eef0f5;padding:7px 6px}
.paper .tot td{border:0;padding:3px 6px}
.paper .grand td{font-weight:800;font-size:14px;border-top:2px solid #1b1f2e;padding-top:7px}
.r{text-align:right}
.timeline{display:flex;gap:0;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tl .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.tl.done{color:var(--text)}.tl.done .dot{background:var(--green);border-color:var(--green);color:#06260f}
.tl.cur .dot{border-color:var(--accent);color:var(--accent)}
.tl-line{width:28px;height:2px;background:var(--line);margin:0 6px}
.mockups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.mock .img{background:var(--card2);aspect-ratio:1/1;display:grid;place-items:center;padding:14px}
.mock .img svg,.mock .img img{width:100%;height:100%;object-fit:contain}
.mock .b{padding:11px 12px}
.pay-cards{grid-template-columns:repeat(4,1fr)}
.bigbar{height:14px;border-radius:8px;background:var(--card2);border:1px solid var(--line);position:relative;overflow:visible;margin:22px 0 8px}
.bigbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:8px}
.bigbar .mark{position:absolute;top:-20px;transform:translateX(-50%);font-size:10.5px;color:var(--amber);white-space:nowrap}
.bigbar .mark:after{content:'';position:absolute;left:50%;top:16px;width:2px;height:22px;background:var(--amber)}
.hist{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hist div{position:relative;padding:0 0 12px;font-size:12.5px}
.hist div:before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding:4px;font-weight:600}
.day{min-height:96px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--card)}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.past{opacity:.5}
.day .n{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.ev{font-size:11px;border-radius:6px;padding:3px 6px;margin-bottom:3px;cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(540px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.phone{width:300px;max-width:100%;margin:0 auto;border:8px solid #0b0d16;border-radius:30px;background:#f3f4f8;color:#1b1f2e;overflow:hidden}
.phone .bar2{background:#5b45e0;color:#fff;padding:14px;font-size:13px}
.phone .content{padding:14px}
.phone textarea{width:100%;border:1px solid #d8dbe6;border-radius:8px;padding:8px;background:#fff;color:#1b1f2e}
.wa{background:#e7ffdb;color:#111;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;border:1px solid #c8eab4}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:.25s;z-index:60;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ---------------- calculations ---------------- */
const isTeam = o => /jersey|kit/i.test(o.product);
const sizeTotal = o => SIZES.reduce((a,s)=>a+(+o.sizes[s]||0),0);
function qTotals(o){
  const q=o.quote, sub=q.items.reduce((a,i)=>a+i.qty*i.price,0);
  const after=Math.max(0,sub-(+q.discount||0)), vat=after*(+q.vat||0)/100, total=after+vat;
  return {sub, after, vat, total, adv: total*(+q.advancePct||0)/100};
}
const paid = o => o.payments.reduce((a,p)=>a+p.a,0);
function prodDays(o){ const rate = /Screen|Embroidery/.test(o.print) ? 80 : 100; return Math.ceil(o.qty/rate)+2; }
function risk(o){
  const left=days(o.deadline), need=prodDays(o);
  if (o.production && left>=0) return {cls:'green', label:'In production', left, need};
  if (left < need) return {cls:'red', label:'At risk', left, need};
  if (left < need+4) return {cls:'amber', label:'Tight', left, need};
  return {cls:'green', label:'On track', left, need};
}
function detailsOk(o){
  if (!o.product || !o.print || !o.qty || sizeTotal(o)!==+o.qty) return false;
  if (isTeam(o) && o.players.length && o.players.length!==+o.qty && !/kit/i.test(o.product)) return false;
  return true;
}
function checks(o){
  const t=qTotals(o);
  return [
    {k:'details', ok:detailsOk(o), label:'Order details', sub: detailsOk(o)?'Complete':'Sizes/names missing'},
    {k:'quote', ok:o.quote.status==='Accepted', label:'Quotation', sub:o.quote.status},
    {k:'design', ok:o.design.status==='Approved', label:'Design', sub:o.design.status==='None'?'No mockup yet':o.design.status},
    {k:'pay', ok:paid(o)>=t.adv-1, label:'Advance', sub: tk(paid(o))+' / '+tk(t.adv)},
  ];
}
const dlPill = o => { const r=risk(o), l=r.left;
  const txt = o.production ? 'In production' : l<0 ? Math.abs(l)+'d overdue' : l===0 ? 'Today' : l+' days left';
  return `<span class="pill p-${r.cls}"><span class="ms" style="font-size:14px">local_shipping</span>${txt}</span>`; };

function pasteModal(id){
  openModal(`<h3>Paste names from Excel / WhatsApp <button class="iconbtn" onclick="closeModal()"><span class="ms">close</span></button></h3>

}
function doPaste(id){
  const o=byId(id); let n=0;
  $('#pasteBox').value.split(/\n/).forEach(l=>{ const p=l.split(/\t|,/).map(x=>x.trim()).filter(Boolean); if(!p.length) return;

    o.players.push({name:p[0].toUpperCase(), no:+p[1]||'', size}); n++; });
  closeModal(); toast(n+' players added'); render();
}

  <div class="card" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:220px"><b>Status:</b> ${dPill(d.status)}
      <div class="small muted" style="margin-top:5px">${d.status==='None'?'Upload the first mockup, then send the approval link to the customer.':d.status==='Waiting'?'Link sent. Customer can approve or ask for changes from their phone.':d.status==='Change requested'?'Customer wants changes — upload a new version.':'Customer approved v'+last.v+'. This design will be printed.'}</div></div>
    <button class="btn" onclick="newVersion('${o.id}')"><span class="ms">upload</span>Upload new version</button>
    ${last && d.status!=='Approved' ? `<button class="btn" onclick="custView('${o.id}')"><span class="ms">smartphone</span>See customer view</button>
      <button class="btn primary" onclick="sendDesign('${o.id}')"><span class="ms">link</span>Send approval link</button>`:''}
  </div>
  ${d.versions.length ? `<div class="mockups">${d.versions.slice().reverse().map(v=>`<div class="mock">
    <div class="img">${mockImg(v)}</div>
    <div class="b"><div style="display:flex;justify-content:space-between;align-items:center"><b>Version ${v.v}</b>${dPill(v.status)}</div>
      ${v.comment?`<div class="small" style="margin-top:8px;padding:8px;border-radius:8px;background:var(--card2)"><span class="ms" style="font-size:15px;color:var(--muted)">chat_bubble</span> “${esc(v.comment)}”</div>`:''}</div>
  </div>`).join('')}</div>`
  : `<div class="card" style="text-align:center;padding:40px"><span class="ms" style="font-size:40px;color:var(--muted)">imagesmode</span><p class="muted">No mockup yet.</p><button class="btn primary" onclick="newVersion('${o.id}')"><span class="ms">upload</span>Upload first mockup</button></div>`}`;
}
function newVersion(id){ const o=byId(id);
  openModal(`<h3>New design version <button class="iconbtn" onclick="closeModal()"><span class="ms">close</span></button></h3>
    <div class="f"><label>Upload mockup image (JPG / PNG)</label><input type="file" id="mkFile" accept="image/*"></div>
    <p class="small muted" style="text-align:center;margin:12px 0">— or make a quick sample mockup —</p>
    <div class="form"><div class="f"><label>Shirt colour</label><input type="color" id="mkCol" value="#2563eb" style="height:38px;padding:3px"></div>
      <div class="f"><label>Text / logo</label><input id="mkTxt" value="${esc(o.company.split(' ')[0].toUpperCase())}"></div>
      <div class="f full"><label>Note for customer</label><input id="mkNote" placeholder="e.g. Logo made bigger as you asked"></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveVersion('${id}')"><span class="ms">save</span>Save version</button></div>`); }
function saveVersion(id){ const o=byId(id), d=o.design, f=$('#mkFile').files[0];
  const v={v:d.versions.length+1, color:$('#mkCol').value, text:$('#mkTxt').value||'LOGO', status:'Draft', comment:''};
  const done=()=>{ d.versions.forEach(x=>{ if(x.status==='Waiting') x.status='Replaced'; }); d.versions.push(v); d.status='None'; hist(o,'Design v'+v.v+' uploaded'); closeModal(); toast('Version '+v.v+' saved — now send the approval link'); render(); };
  if(f){ const r=new FileReader(); r.onload=e=>{ v.img=e.target.result; done(); }; r.readAsDataURL(f); } else done(); }
function sendDesign(id){ const o=byId(id), d=o.design, v=d.versions[d.versions.length-1]; v.status='Waiting'; d.status='Waiting'; hist(o,'Approval link for design v'+v.v+' sent on WhatsApp'); toast('Approval link sent (demo)'); render(); }
function custView(id){ const o=byId(id), v=o.design.versions[o.design.versions.length-1];
  openModal(`<h3>What the customer sees <button class="iconbtn" onclick="closeModal()"><span class="ms">close</span></button></h3>
   <div class="phone"><div class="bar2"><b>${o.biz}</b><div style="opacity:.8;font-size:11.5px">Design for ${esc(o.company)} · v${v.v}</div></div>
    <div class="content"><div style="background:#fff;border-radius:10px;padding:10px;aspect-ratio:1/1">${mockImg(v)}</div>
     <p style="font-size:12.5px;margin:10px 0">${o.qty} pcs · ${esc(o.print)} · delivery ${fmt(o.deadline)}</p>
     <textarea id="cvNote" rows="2" placeholder="Any change? Write here (optional)"></textarea>
     <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1;justify-content:center;background:#fff;color:#dc2626;border-color:#f3c7c7" onclick="custAnswer('${id}',false)">Need changes</button>
     <button class="btn" style="flex:1;justify-content:center;background:#15803d;color:#fff;border-color:#15803d" onclick="custAnswer('${id}',true)">Approve ✓</button></div></div></div>
   <p class="small muted" style="text-align:center;margin-bottom:0">Try it — the answer updates the order.</p>`); }
function custAnswer(id,ok){ const o=byId(id), d=o.design, v=d.versions[d.versions.length-1], note=$('#cvNote').value.trim();
  v.status = ok?'Approved':'Change requested'; v.comment = note || (ok?'Approved':'Please change'); d.status=v.status;
  hist(o, ok?'Customer approved design v'+v.v:'Customer asked for changes on v'+v.v+(note?': “'+note+'”':''),'Customer');
  closeModal(); toast(ok?'Design approved by customer ✓':'Change request received'); render(); }

/* ---- tab: payments ---- */
function tabPay(o){
  const t=qTotals(o), p=paid(o), bal=Math.max(0,t.total-p), pct=t.total?Math.min(100,p/t.total*100):0, advOk=p>=t.adv-1;
  return `
  <div class="grid pay-cards">
    <div class="card kpi"><div class="l">Order total</div><div class="v">${tk(t.total)}</div><div class="small muted">From quotation</div></div>
    <div class="card kpi"><div class="l">Advance needed (${o.quote.advancePct}%)</div><div class="v" style="color:var(--amber)">${tk(t.adv)}</div><div class="small ${advOk?'':'muted'}" style="${advOk?'color:var(--green)':''}">${advOk?'✓ Received':'Before printing starts'}</div></div>
    <div class="card kpi"><div class="l">Received</div><div class="v" style="color:var(--green)">${tk(p)}</div><div class="small muted">${o.payments.length} payment${o.payments.length===1?'':'s'}</div></div>
    <div class="card kpi"><div class="l">Balance due</div><div class="v" style="color:${bal?'var(--red)':'var(--green)'}">${tk(bal)}</div><div class="small muted">${bal?'Collect on delivery':'Fully paid'}</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="bigbar"><i style="width:${pct}%"></i><span class="mark" style="left:${o.quote.advancePct}%">Advance ${o.quote.advancePct}%</span></div>
    <div class="small muted">${Math.round(pct)}% of the order paid</div>
  </div>
  <div class="two" style="margin-top:14px">
    <div class="card" style="padding:0"><div style="padding:16px 16px 4px"><h3 style="margin:0"><span class="ms">receipt</span>Payments received</h3></div>
      <div class="tablewrap"><table><thead><tr><th>Date</th><th>Method</th><th>Transaction ID</th><th class="r">Amount</th><th></th></tr></thead>
      <tbody>${o.payments.map((x,i)=>`<tr><td>${fmt(x.d)}</td><td><span class="pill ${x.m==='bKash'?'p-red':x.m==='Nagad'?'p-amber':'p-blue'}">${x.m}</span></td><td class="small muted">${esc(x.trx)||'—'}</td><td class="r"><b>${tk(x.a)}</b></td>
        <td><button class="btn sm ghost" onclick="printReceipt('${o.id}',${i})"><span class="ms">print</span>Receipt</button></td></tr>`).join('') || `<tr><td colspan="5" class="muted" style="text-align:center;padding:22px">No payment yet.</td></tr>`}</tbody></table></div></div>
    <div class="card"><h3><span class="ms">add_card</span>Record a payment</h3>
      <div class="form">
        <div class="f"><label>Amount (৳)</label><input type="number" id="pAmt" value="${Math.round(Math.max(0,(advOk?bal:t.adv-p)))}"></div>
        <div class="f"><label>Method</label><select id="pMet">${PAY_METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div>
        <div class="f"><label>Transaction ID</label><input id="pTrx" placeholder="e.g. BK8H2K91QZ"></div>
        <div class="f"><label>Date</label><input type="date" id="pDate" value="${iso(TODAY)}"></div>
      </div>
      <button class="btn primary" style="margin-top:12px" onclick="addPay('${o.id}')"><span class="ms">check</span>Save payment</button>
      <p class="small muted" style="margin-bottom:0">Amount is pre-filled with what is still due${advOk?'':' for the advance'}.</p>
    </div>
  </div>`;
}
function addPay(id){ const o=byId(id), a=+$('#pAmt').value; if(!a||a<=0) return toast('Enter an amount');
  const m=$('#pMet').value; o.payments.push({d:$('#pDate').value||iso(TODAY), m, trx:$('#pTrx').value.trim(), a});
  hist(o,'Payment '+tk(a)+' received via '+m); toast('Payment saved ✓'); render(); }
function printReceipt(id,i){ const o=byId(id), x=o.payments[i];
  $('#printArea').innerHTML = `<div class="paper" style="max-width:520px"><div class="ph"><div><h4>${o.biz}</h4><div style="color:#687089">GM Group</div></div><div style="text-align:right"><b>MONEY RECEIPT</b><div style="color:#687089">${o.id}-R${i+1}</div></div></div>
   <p>Received from <b>${esc(o.name)}</b> (${esc(o.company)}) the amount of <b>${tk(x.a)}</b> via ${x.m}${x.trx?' (Trx: '+esc(x.trx)+')':''} on ${fmt(x.d)} 2026, for order ${o.id}.</p>
   <p>Order total ${tk(qTotals(o).total)} · Paid so far ${tk(paid(o))} · Balance ${tk(Math.max(0,qTotals(o).total-paid(o)))}</p><p style="margin-top:40px;color:#687089">Signature ____________</p></div>`;
  window.print(); }

/* ---- tab: history ---- */
function tabHistory(o){
  return `<div class="card"><h3><span class="ms">history</span>Everything that happened</h3><div class="hist">${o.history.map(h=>`<div><b>${esc(h.t)}</b><div class="muted small">${h.w} · ${fmt(h.d)}</div></div>`).join('')}</div></div>`;
}

/* ---------------- CALENDAR ---------------- */
function viewCalendar(){
  const start = new Date(TODAY); start.setDate(start.getDate() - ((start.getDay()+6)%7)); // Monday
  const L=list(), cells=[];
  for(let i=0;i<28;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const s=iso(d);
    const evs=L.filter(o=>o.deadline===s);
    cells.push(`<div class="day ${s===iso(TODAY)?'today':''} ${d<TODAY?'past':''}"><div class="n">${d.getDate()} ${d.getDate()===1||i===0?MON[d.getMonth()]:''}</div>
      ${evs.map(o=>{const r=risk(o);return `<div class="ev p-${r.cls}" onclick="go('order',{id:'${o.id}',tab:'details'})" title="${esc(o.name)} · ${o.qty} pcs">${esc(o.name.split(' ')[0])} · ${o.qty}</div>`}).join('')}</div>`); }
  return `<p class="muted" style="margin-top:0">Every order on its delivery date. Colour shows if there is enough time to produce it.
    <span class="pill p-green">On track</span> <span class="pill p-amber">Tight</span> <span class="pill p-red">At risk</span></p>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells.join('')}</div>`;
}

/* ---------------- QUOTES LIST ---------------- */
function viewQuotes(){
  const L=list(), sum=s=>L.filter(o=>o.quote.status===s).reduce((a,o)=>a+qTotals(o).total,0);
  return `<div class="grid kpis">${QSTEPS.map(s=>`<div class="card kpi"><div class="l">${qPill(s)}</div><div class="v">${L.filter(o=>o.quote.status===s).length}</div><div class="small muted">${tk(sum(s))}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px;padding:0"><div class="tablewrap"><table>
    <thead><tr><th>Quote</th><th>Customer</th><th>Business</th><th class="r">Total</th><th>Status</th><th>Sent</th><th></th></tr></thead>
    <tbody>${L.map(o=>`<tr class="click" onclick="go('order',{id:'${o.id}',tab:'quote'})"><td><b>Q-${o.id.slice(3)}</b></td><td>${esc(o.name)}<div class="small muted">${esc(o.company)}</div></td><td class="small">${o.biz}</td>
      <td class="r"><b>${tk(qTotals(o).total)}</b></td><td>${qPill(o.quote.status)}</td><td class="small muted">${o.quote.sent?fmt(o.quote.sent):'—'}</td>
      <td>${o.quote.status==='Viewed'?'<span class="pill p-amber">Follow up</span>':o.quote.status==='Draft'?'<span class="pill p-grey">Not sent</span>':''}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------------- DESIGNS LIST ---------------- */
function viewDesigns(){
  const L=list().filter(o=>o.design.versions.length);
  const order={'Waiting':0,'Change requested':1,'None':2,'Approved':3};
  L.sort((a,b)=>order[a.design.status]-order[b.design.status]);
  return `<p class="muted" style="margin-top:0">Latest mockup of every order. Waiting ones first.</p>
  <div class="mockups">${L.map(o=>{const v=o.design.versions[o.design.versions.length-1];return `<div class="mock" style="cursor:pointer" onclick="go('order',{id:'${o.id}',tab:'design'})">
    <div class="img">${mockImg(v)}</div><div class="b"><div style="display:flex;justify-content:space-between;gap:6px;align-items:center"><b>${esc(o.name)}</b>${dPill(o.design.status)}</div>
    <div class="small muted" style="margin-top:4px">v${v.v} · ${esc(o.product)} · ${o.qty} pcs</div></div></div>`}).join('')}</div>`;
}

/* ---------------- PAYMENTS LEDGER ---------------- */
function viewPayments(){
  const L=list(), all=[]; L.forEach(o=>o.payments.forEach(p=>all.push({...p,o})));
  all.sort((a,b)=>b.d.localeCompare(a.d));
  const byM={}; all.forEach(p=>byM[p.m]=(byM[p.m]||0)+p.a);
  const due = L.filter(o=>!o.production).map(o=>({o, need:Math.max(0,qTotals(o).adv-paid(o))})).filter(x=>x.need>1 && o_ok(x.o));
  function o_ok(o){ return o.quote.status!=='Draft'; }
  return `<div class="grid kpis">
    <div class="card kpi"><div class="l">Collected</div><div class="v" style="color:var(--green)">${tk(all.reduce((a,p)=>a+p.a,0))}</div><div class="small muted">${all.length} payments</div></div>
    ${['bKash','Nagad','Bank transfer'].map(m=>`<div class="card kpi"><div class="l">${m}</div><div class="v">${tk(byM[m]||0)}</div><div class="small muted">&nbsp;</div></div>`).join('')}
  </div>
  <div class="two" style="margin-top:14px">
    <div class="card" style="padding:0"><div style="padding:16px 16px 4px"><h3 style="margin:0">All payments</h3></div><div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Customer</th><th>Method</th><th>Trx ID</th><th class="r">Amount</th></tr></thead>
      <tbody>${all.map(p=>`<tr class="click" onclick="go('order',{id:'${p.o.id}',tab:'pay'})"><td>${fmt(p.d)}</td><td>${esc(p.o.name)}<div class="small muted">${p.o.id}</div></td><td>${p.m}</td><td class="small muted">${esc(p.trx)}</td><td class="r"><b>${tk(p.a)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No payments</td></tr>'}</tbody></table></div></div>
    <div class="card"><h3><span class="ms" style="color:var(--red)">pending_actions</span>Advance to collect</h3>
      ${due.map(x=>`<div class="who" style="padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="go('order',{id:'${x.o.id}',tab:'pay'})"><span class="av">${initials(x.o.name)}</span><div style="flex:1"><b>${esc(x.o.name)}</b><small>Quotation ${x.o.quote.status.toLowerCase()} · ${x.o.staff}</small></div><b style="color:var(--red)">${tk(x.need)}</b></div>`).join('')||'<p class="muted">Nothing due 🎉</p>'}
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
